# behave configuration file.
# It is loaded automatically when behave runs from this directory.
# behave also looks for ".behaverc", "setup.cfg", "tox.ini" and "pyproject.toml"
# in the current dir, the home dir and %APPDATA%.
#
#   behave                            # paths/format/etc. come from here
#   behave --name "<scenario_name>"  # CLI arguments override this file
#   behave -D env=stage               # own data: context.config.userdata["env"]
#
# NOTE: keys mirror the long CLI options (see "behave --help") without "--".
# NOTE: keep this file ASCII-only: configparser reads it with the system
#       encoding (cp1251/cp1252 on Windows), so non-ASCII comments break it.
#       Russian documentation lives in README.md.

[behave]
# Where to look for .feature files, steps/ and environment.py.
paths = features

# Gantt drafts live next to the Tasks features but are not part of this suite.
# Exclude them so a plain `behave` run contains only Tasks API tests.
# (Regular expression, matched against the feature file path.)
#exclude_re = .*Scheduling[.]feature

# Default formatter: pretty | plain | progress | json | ...
default_format = pretty

[language]
default = en

# --- Debug-friendly defaults ----------------------------------------------
# Do not swallow print(), stderr and logging output, so it shows up
# immediately both in a debugger terminal and in a plain run.
capture_stdout = false
capture_stderr = false
capture_log = false

# Log level for step loggers. Switch to DEBUG to see request/response bodies.
logging_level = INFO
logging_format = %(levelname)-7s %(name)s: %(message)s

# --- What to show in the report -------------------------------------------
# file:line of the matched step definition
show_source = true
# per-step execution time
show_timings = true
# snippets for undefined steps
show_snippets = true

[behave.userdata]
base_url = http://127.0.0.1:8090
